# Reverse proxy for production: terminates HTTP, routes /api to the backend and the rest to the
# Next.js frontend. Put TLS termination (certs) in front of this in a real deployment.
worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    upstream frontend { server frontend:3000; }
    upstream backend  { server backend:8080; }

    server {
        listen 80;
        server_name _;

        # Security headers (TLS/HSTS handled by the TLS terminator in prod)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
