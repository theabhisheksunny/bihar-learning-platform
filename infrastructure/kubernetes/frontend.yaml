apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bihar-learning
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: bihar-learning-frontend:latest   # push to your registry and update
          ports: [{ containerPort: 3000 }]
          env:
            - { name: BACKEND_URL, value: http://backend:8080 }
            - { name: SITE_URL, value: "https://your-domain.example" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bihar-learning
spec:
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000 }]
