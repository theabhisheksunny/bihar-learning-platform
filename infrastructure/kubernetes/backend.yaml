apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bihar-learning
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: bihar-learning-backend:latest   # push to your registry and update
          ports: [{ containerPort: 8080 }]
          env:
            - { name: DB_URL, value: jdbc:postgresql://postgres:5432/bihar_learning }
            - { name: DB_USERNAME, value: bihar }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bihar-secrets, key: DB_PASSWORD } }
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: "6379" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: bihar-secrets, key: JWT_SECRET } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: bihar-secrets, key: ADMIN_PASSWORD } }
            - { name: CORS_ALLOWED_ORIGINS, value: "https://your-domain.example" }
            - { name: SYNC_ENABLED, value: "false" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bihar-learning
spec:
  selector: { app: backend }
  ports: [{ port: 8080, targetPort: 8080 }]
