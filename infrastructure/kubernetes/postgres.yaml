apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bihar-learning
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: bihar_learning }
            - { name: POSTGRES_USER, value: bihar }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: bihar-secrets, key: DB_PASSWORD } }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "bihar", "-d", "bihar_learning"] }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bihar-learning
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
