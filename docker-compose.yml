services:
  postgres:
    image: postgres:16-alpine
    container_name: bihar-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-bihar_learning}
      POSTGRES_USER: ${DB_USERNAME:-bihar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bihar}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bihar} -d ${DB_NAME:-bihar_learning}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bihar-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: bihar-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-bihar_learning}
      DB_USERNAME: ${DB_USERNAME:-bihar}
      DB_PASSWORD: ${DB_PASSWORD:-bihar}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bihar-learning.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      SYNC_ENABLED: ${SYNC_ENABLED:-false}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    container_name: bihar-frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      BACKEND_URL: http://backend:8080
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
